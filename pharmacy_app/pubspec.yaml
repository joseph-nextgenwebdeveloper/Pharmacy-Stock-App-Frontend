name: pharmacy_app
description: StockRoom — Pharmacy Inventory Management System (staff app).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token / user storage
  flutter_secure_storage: ^9.2.2

  # Fonts / theming
  google_fonts: ^6.2.1

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # Picking a medicine photo from camera/gallery
  image_picker: ^1.1.2

  # Local notifications (daily inventory reminder)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Dates / formatting
  intl: ^0.19.0

  # Iterable helpers (firstOrNull, etc.)
  collection: ^1.19.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/