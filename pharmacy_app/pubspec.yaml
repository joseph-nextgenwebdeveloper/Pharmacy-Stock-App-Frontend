name: pharmacy_app
description: Pharmacy Inventory Management System

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Networking
  dio: ^5.9.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Routing
  go_router: ^16.2.1

  # Barcode Scanner
  mobile_scanner: ^7.1.3

  # Fonts
  google_fonts: ^6.3.2

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1

  # Utilities
  intl: ^0.20.2
  connectivity_plus: ^7.0.0

  # JSON
  json_annotation: ^4.9.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  build_runner: ^2.7.0
  json_serializable: ^6.11.1
  flutter_native_splash: ^2.4.8

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  fonts: []

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/josekiarie_pharmacy_logo.png"
  adaptive_icon_background: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logos/josekiarie_pharmacy_logo.png

  android: true
  ios: false
  web: false

  android_12:
    color: "#FFFFFF"
    image: assets/logos/josekiarie_pharmacy_logo.png