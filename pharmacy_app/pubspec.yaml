name: pharmacy_app
description: Pharmacy Inventory Management System

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Networking
  dio: ^5.9.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Routing
  go_router: ^16.2.1

  # Barcode Scanner
  mobile_scanner: ^7.1.3

  # Fonts
  google_fonts: ^6.3.2

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1

  # Utilities
  intl: ^0.20.2
  connectivity_plus: ^7.0.0

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.7.0
  json_serializable: ^6.11.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  fonts: []